name: Quality checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed log files and build metadata
        run: |
          if git ls-files | grep -E '(^|/)[^/]+\.log$|(^|/)firebase-debug\.log$|(^|/)[^/]+\.tsbuildinfo$'; then
            echo "::error::Log files and TypeScript build metadata must not be committed."
            exit 1
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint and save reports
        run: |
          npm run lint:report
          npm run lint -- --max-warnings=0

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload ESLint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: |
            reports/eslint-report.html
            reports/eslint-report.json
          if-no-files-found: warn
          retention-days: 14
