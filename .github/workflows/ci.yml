name: CI and Vercel deployment
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: sis-ci-build
      SITE_URL: https://ci.example.invalid
      APP_ORIGIN: https://ci.example.invalid
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Reject committed log and TypeScript build files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)([^/]*\.log|firebase-debug\.log|[^/]*\.tsbuildinfo)$'; then
            echo "Log files and TypeScript build metadata must not be committed."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          {
            VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID }}",
            VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}",
          }
      - run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          {
            VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID }}",
            VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}",
          }
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
