name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build, audit, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject generated reports and build metadata
        run: |
          if git ls-files | grep -E '(^|/)(test-results|reports)(/|$)|(^|/)eslint-report\.json$|(^|/)[^/]+\.tsbuildinfo$|(^|/)[^/]+\.log$'; then
            echo "::error::Generated test/lint reports, logs and TypeScript build metadata must not be committed."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          VERCEL_ENV: development
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-test-project
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ci-test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
